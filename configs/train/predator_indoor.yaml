misc:
  exp_dir: predator_indoor
  mode: train
  gpu_mode: True
  verbose: True
  verbose_freq: 500
  snapshot_freq: 1
  pretrain: ''


model:
  model: ResUNetBN2C
  in_feats_dim: 1
  out_feats_dim: 32
  conv1_kernel_size: 5
  normalize_feature: True
  dist_type: L2

overlap_attention_module:
  attention_feats_dim: 256
  num_head: 4
  nets: ['self','cross','self']
  # 'self' layers are masked multi-head self-attention (torch's fused attention) with a 3D
  # rotary position embedding on the voxel coordinates; 'cross' layers get no position
  # embedding, the two clouds are not registered yet
  rope: True
  rope_theta: 100.0

loss:
  pos_margin: 0.1
  neg_margin: 1.4
  log_scale: 24
  pos_radius: 0.0375
  safe_radius: 0.1
  overlap_radius: 0.0375
  matchability_radius: 0.05 
  w_circle_loss: 1.0
  w_overlap_loss: 1.0
  w_saliency_loss: 0.0
  max_points: 256

optimiser:
  optimizer: SGD
  max_epoch: 100
  # Upstream trained one pair at a time and accumulated (summed) four gradients before
  # stepping. The loss averages over the pairs of a batch instead, so a batch of 4 with
  # iter_size 1 needs 4x the learning rate to take the same step.
  lr: 0.2
  momentum: 0.8
  weight_decay: 0.0001
  bn_momentum: 0.05
  scheduler: ExpLR
  scheduler_gamma: 0.99
  scheduler_freq: 1
  iter_size: 1

dataset:
  dataset: indoor
  benchmark: 3DMatch
  root: data/indoor
  voxel_size: 0.025
  # The attention is masked per pair, so pairs of a batch never mix (see
  # scripts/test_batch_equivalence.py). Testing still runs pair by pair:
  # use configs/test/indoor.yaml, which keeps batch_size 1.
  #
  # 4 is what reproduces the authors' training curve (see the README). Larger batches fit:
  # scripts/bench_batch_size.py measures ~26 GiB per million voxels, i.e. 24 GiB at 32 and
  # 38 GiB at 48 on a 63 GiB card, and 0.070 s/pair at 32 against 0.117 at 8. Raising it
  # also divides the number of optimiser steps per epoch, so the learning rate below has to
  # be revisited -- it is currently the equivalent of the authors' setting.
  batch_size: 12
  eval_pairs: 300          # benchmark pairs registered after every epoch
  num_workers: 6 
  augment_noise: 0.005
  train_info: configs/indoor/train_info.pkl
  val_info: configs/indoor/val_info.pkl

demo:
  src_pcd: assets/cloud_bin_21.pth
  tgt_pcd: assets/cloud_bin_34.pth
  n_points: 1000

